<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" style="background:#070b14; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nfcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="monGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="url(#bgGrad)"/>

  <!-- TITLE BANNER -->
  <rect x="28" y="20" width="1344" height="76" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="50" y="52" font-size="21" font-weight="800" fill="#38bdf8" letter-spacing="0.8">PROJECT VERONICA — NEW BUILD WALL DISPLAY &amp; BEHIND-SCREEN POD SCHEMATIC</text>
  <text x="50" y="77" font-size="13" fill="#94a3b8">NodeMCU ESP-32S (38-Pin)  •  PN532 NFC V3 (I2C GPIO 21/22, Behind-Screen Tap)  •  Piezo Buzzer (GPIO 27)  •  800×480 Touch Display (Pi 5 Kiosk)</text>
  <rect x="1150" y="34" width="202" height="46" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="1251" y="54" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">REV 5.0 (DETACHABLE)</text>
  <text x="1251" y="70" font-size="10" fill="#cbd5e1" text-anchor="middle">Legacy Keypad/LCD Removed</text>

  <!-- ENCLOSURE ZONE OUTLINE (BEHIND SCREEN FRAME) -->
  <rect x="28" y="112" width="944" height="670" rx="16" fill="#0b1120" fill-opacity="0.7" stroke="#334155" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="44" y="102" width="388" height="22" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="238" y="117" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">INSIDE DETACHABLE REAR CIRCUIT FRAME (BEHIND MONITOR)</text>

  <!-- POWER & GROUND RAILS INSIDE FRAME -->
  <rect x="52" y="142" width="440" height="26" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="272" y="159" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">+5.0V USB DC SUPPLY RAIL (TO ESP32 USB/5V &amp; DISPLAY 5V)</text>

  <rect x="510" y="142" width="435" height="26" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="727" y="159" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">+3.3V REGULATED LOGIC BUS (FROM ESP32 3V3 LDO)</text>

  <rect x="52" y="734" width="893" height="34" rx="7" fill="#052e16" stroke="#22c55e" stroke-width="1.8"/>
  <text x="498" y="756" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle" letter-spacing="1">COMMON SYSTEM GROUND RETURN BUS (0V GND)</text>

  <!-- ====================================================================== -->
  <!-- 1. PN532 NFC V3 MODULE (TOP-LEFT — BEHIND SCREEN UPPER TAP ZONE)       -->
  <!-- ====================================================================== -->
  <rect x="55" y="192" width="315" height="264" rx="12" fill="url(#nfcGrad)" stroke="#ef4444" stroke-width="2"/>
  <rect x="67" y="204" width="291" height="28" rx="6" fill="#991b1b"/>
  <text x="212" y="223" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PN532 NFC V3 READER (I2C MODE)</text>

  <!-- PCB Coil Graphic -->
  <rect x="70" y="244" width="124" height="114" rx="8" fill="#450a0a" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="80" y="254" width="104" height="94" rx="5" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <rect x="90" y="264" width="84" height="74" rx="4" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  <text x="132" y="294" font-size="10" font-weight="bold" fill="#fecaca" text-anchor="middle">13.56 MHz</text>
  <text x="132" y="309" font-size="9.5" fill="#fca5a5" text-anchor="middle">Front-Facing</text>
  <text x="132" y="323" font-size="9.5" fill="#fca5a5" text-anchor="middle">Trace Coil</text>

  <!-- Right-Edge Pin Headers (Zero text crossover!) -->
  <text x="354" y="260" font-size="11" font-weight="bold" fill="#e9d5ff" text-anchor="end">SCL ──▶ GPIO 22</text>
  <circle cx="370" cy="256" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>

  <text x="354" y="292" font-size="11" font-weight="bold" fill="#bae6fd" text-anchor="end">SDA ──▶ GPIO 21</text>
  <circle cx="370" cy="288" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>

  <text x="354" y="324" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="end">VCC ──▶ +3.3V</text>
  <circle cx="370" cy="320" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <text x="354" y="356" font-size="11" font-weight="bold" fill="#86efac" text-anchor="end">GND ──▶ 0V GND</text>
  <circle cx="370" cy="352" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>

  <!-- DIP Switch & Screen-Tap RF Note -->
  <rect x="67" y="372" width="291" height="72" rx="6" fill="#18181b" stroke="#7f1d1d"/>
  <text x="212" y="389" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle">DIP: SEL0=1 (ON) , SEL1=0 (OFF)  |  I2C Addr: 0x24</text>
  <text x="212" y="407" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Mounted directly behind upper-center glass of screen</text>
  <text x="212" y="422" font-size="9.5" fill="#93c5fd" text-anchor="middle">+ 0.4mm Ferrite Absorber Sheet between LCD backplate &amp; PCB</text>
  <text x="212" y="436" font-size="9.5" fill="#34d399" text-anchor="middle">Enables Tap-on-Screen NFC Read (~20–35mm Range)</text>

  <!-- ====================================================================== -->
  <!-- 2. PASSIVE PIEZO BUZZER MODULE (BOTTOM-LEFT)                           -->
  <!-- ====================================================================== -->
  <rect x="55" y="476" width="315" height="232" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <rect x="67" y="488" width="291" height="28" rx="6" fill="#0369a1"/>
  <text x="212" y="507" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PIEZO BUZZER MODULE (PWM TONE)</text>

  <!-- Buzzer Visual -->
  <circle cx="122" cy="576" r="34" fill="#090d16" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="122" cy="576" r="10" fill="#0284c7"/>
  <text x="122" y="626" font-size="10" fill="#94a3b8" text-anchor="middle">Acoustic Port</text>
  <text x="122" y="639" font-size="9" fill="#64748b" text-anchor="middle">Faces Bottom Grille</text>

  <!-- Right-Edge Buzzer Pins -->
  <text x="354" y="552" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="end">I / O ──▶ GPIO 27</text>
  <circle cx="370" cy="548" r="7" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>

  <text x="354" y="590" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="end">VCC ──▶ +3.3V</text>
  <circle cx="370" cy="586" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <text x="354" y="628" font-size="11" font-weight="bold" fill="#86efac" text-anchor="end">GND ──▶ 0V GND</text>
  <circle cx="370" cy="624" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>

  <rect x="67" y="658" width="291" height="36" rx="5" fill="#1e293b"/>
  <text x="212" y="674" font-size="9.5" fill="#38bdf8" text-anchor="middle" font-weight="bold">PWM Driven @ 2000Hz–3200Hz via ESP32 tone()</text>
  <text x="212" y="688" font-size="9" fill="#94a3b8" text-anchor="middle">Triggered on NFC swipe &amp; remote Pi 5 TCP beep commands</text>

  <!-- ====================================================================== -->
  <!-- 3. NODEMCU ESP-32S (38-PIN CONTROLLER — CENTER RIGHT INSIDE FRAME)     -->
  <!-- ====================================================================== -->
  <rect x="495" y="192" width="445" height="516" rx="16" fill="url(#espGrad)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- RF Shield & Board Header -->
  <rect x="572" y="210" width="290" height="106" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="717" y="242" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1.2">NODEMCU ESP-32S (V1.1)</text>
  <text x="717" y="264" font-size="11.5" fill="#cbd5e1" text-anchor="middle">38-PIN DUAL-CORE WI-FI SENSOR NODE</text>
  <text x="717" y="284" font-size="10" fill="#38bdf8" text-anchor="middle" font-family="monospace">Firmware: esp32_sensor_pod.ino</text>
  <text x="717" y="302" font-size="9.5" fill="#34d399" text-anchor="middle" font-family="monospace">LAN TCP Client: 192.168.0.180 ↔ Pi5:8765</text>

  <!-- Left & Right Header Strips -->
  <rect x="502" y="330" width="22" height="356" rx="4" fill="#090d16" stroke="#1e293b"/>
  <rect x="911" y="330" width="22" height="356" rx="4" fill="#090d16" stroke="#1e293b"/>

  <!-- LEFT RAIL PINS (Terminals on x=503, labels right of rail) -->
  <circle cx="503" cy="356" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="532" y="361" font-size="11.5" font-weight="bold" fill="#86efac">Pin L1: GND (Ground)</text>

  <circle cx="503" cy="410" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="532" y="415" font-size="11.5" font-weight="bold" fill="#e9d5ff">Pin L3: GPIO 22 (I2C SCL)</text>

  <circle cx="503" cy="468" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="532" y="473" font-size="11.5" font-weight="bold" fill="#bae6fd">Pin L6: GPIO 21 (I2C SDA)</text>

  <circle cx="503" cy="526" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="532" y="531" font-size="11.5" font-weight="bold" fill="#86efac">Pin L7: GND (Ground)</text>

  <rect x="532" y="566" width="166" height="46" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="615" y="585" font-size="9.5" fill="#94a3b8" text-anchor="middle">Pins L8–L19 Unused</text>
  <text x="615" y="601" font-size="9" fill="#64748b" text-anchor="middle">(Keypad/SPI Display Removed)</text>

  <!-- RIGHT RAIL PINS (Terminals on x=932, labels left of rail) -->
  <circle cx="932" cy="356" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="903" y="361" font-size="11.5" font-weight="bold" fill="#fde68a" text-anchor="end">Pin R1: 3V3 (Regulated Out)</text>

  <rect x="742" y="400" width="160" height="58" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="822" y="418" font-size="9.5" fill="#facc15" text-anchor="middle" font-weight="bold">GPIO 34 / 35 Reserved</text>
  <text x="822" y="433" font-size="9" fill="#94a3b8" text-anchor="middle">Input-only ADC pins</text>
  <text x="822" y="447" font-size="9" fill="#64748b" text-anchor="middle">(Dummy IRQ=34, RST=33)</text>

  <circle cx="932" cy="496" r="7" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>
  <text x="903" y="501" font-size="11.5" font-weight="bold" fill="#fef08a" text-anchor="end">Pin R11: GPIO 27 (Buzzer PWM)</text>

  <circle cx="932" cy="566" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="903" y="571" font-size="11.5" font-weight="bold" fill="#86efac" text-anchor="end">Pin R14: GND (Ground)</text>

  <circle cx="932" cy="642" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="903" y="647" font-size="11.5" font-weight="bold" fill="#fca5a5" text-anchor="end">Pin R19: 5V / VIN Power In</text>

  <!-- Micro-USB Port Bottom Center -->
  <rect x="665" y="688" width="104" height="24" rx="4" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="717" y="704" font-size="9.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">MICRO-USB 5V</text>

  <!-- ====================================================================== -->
  <!-- 4. RIGHT PANEL: 800x480 TOUCH MONITOR + CEILING PI 5 HUB               -->
  <!-- ====================================================================== -->
  <rect x="1008" y="112" width="364" height="310" rx="14" fill="url(#monGrad)" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="1024" y="126" width="332" height="32" rx="6" fill="#1e40af"/>
  <text x="1190" y="147" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">800×480 TOUCH DISPLAY PANEL</text>

  <rect x="1032" y="172" width="316" height="148" rx="8" fill="#070b14" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="1102" y="180" width="176" height="34" rx="17" fill="#7f1d1d" fill-opacity="0.55" stroke="#ef4444" stroke-dasharray="4 3"/>
  <text x="1190" y="201" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">📡 NFC TAP ZONE ON SCREEN</text>

  <text x="1190" y="242" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Chromium Kiosk UI (/pi @ 800×480)</text>
  <text x="1190" y="262" font-size="9.5" fill="#94a3b8" text-anchor="middle">• Live Recording HUD + Subject Sync</text>
  <text x="1190" y="278" font-size="9.5" fill="#94a3b8" text-anchor="middle">• Mounted on Wall Height + Tilt Stand</text>
  <text x="1190" y="294" font-size="9.5" fill="#34d399" text-anchor="middle">• Quick-Release Detachable Frame</text>

  <rect x="1032" y="334" width="316" height="72" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="1046" y="354" font-size="10.5" font-weight="bold" fill="#fca5a5">• +5V Power Port  ◀── 5V DC Supply / USB</text>
  <text x="1046" y="373" font-size="10.5" font-weight="bold" fill="#38bdf8">• HDMI / DSI Video ◀── From Pi 5 Hub</text>
  <text x="1046" y="392" font-size="10.5" font-weight="bold" fill="#a855f7">• USB Touch Out   ──▶ To Pi 5 USB Host</text>

  <rect x="1008" y="446" width="364" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1190" y="465" font-size="10.5" font-weight="bold" fill="#fbbf24" text-anchor="middle">⚡ DETACHABLE QUICK-RELEASE CONDUIT</text>
  <text x="1190" y="481" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Screen + Rear Circuit Box lift cleanly off Wall Stand</text>

  <rect x="1008" y="514" width="364" height="268" rx="14" fill="url(#piGrad)" stroke="#22c55e" stroke-width="2"/>
  <rect x="1024" y="528" width="332" height="32" rx="6" fill="#166534"/>
  <text x="1190" y="549" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CEILING HUB: RASPBERRY PI 5 (UNCHANGED)</text>

  <text x="1030" y="584" font-size="11" font-weight="bold" fill="#86efac">Existing Overhead Hardware (Not Modified):</text>
  <text x="1036" y="606" font-size="10" fill="#dcfce7">• Raspberry Pi 5 (8GB) + Active Cooler</text>
  <text x="1036" y="625" font-size="10" fill="#dcfce7">• Kreo 4K Owl Camera (/dev/video0)</text>
  <text x="1036" y="644" font-size="10" fill="#dcfce7">• ALSA Conference Mic + 256GB SSD</text>
  <text x="1036" y="663" font-size="10" fill="#dcfce7">• Flask Kiosk Server (:5000) &amp; TCP Pod (:8765)</text>

  <rect x="1026" y="682" width="328" height="82" rx="8" fill="#052e16" stroke="#34d399" stroke-width="1.2"/>
  <text x="1190" y="702" font-size="10.5" font-weight="bold" fill="#34d399" text-anchor="middle">WIRELESS LINK TO BEHIND-SCREEN POD</text>
  <text x="1190" y="721" font-size="10" fill="#e2e8f0" text-anchor="middle">Wi-Fi 2.4GHz TCP Socket (Port 8765)</text>
  <text x="1190" y="738" font-size="9.5" fill="#94a3b8" text-anchor="middle">ESP32 sends NFC UID &amp; Heartbeats</text>
  <text x="1190" y="753" font-size="9.5" fill="#94a3b8" text-anchor="middle">Pi 5 sends Buzzer Chime &amp; Subject Updates</text>

  <!-- ====================================================================== -->
  <!-- WIRE ROUTING TRACES (CLEAN GUTTER CHANNELS, ZERO OVERLAPS)             -->
  <!-- ====================================================================== -->

  <!-- +5V Rail (from Rail at 492,155) to ESP32 Pin R19 (932,642) & Display 5V -->
  <path d="M 492 155 L 972 155 L 972 642 L 939 642" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  <path d="M 972 349 L 1008 349" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  <circle cx="972" cy="349" r="4" fill="#ef4444"/>

  <!-- ESP32 3V3 Out (Pin R1: 939,356) up to 3.3V Bus (727,168) -->
  <path d="M 939 356 L 955 356 L 955 178 L 727 178 L 727 168" stroke="#f59e0b" stroke-width="2.5" fill="none"/>

  <!-- 3.3V Bus distribution to PN532 VCC (377,320) & Buzzer VCC (377,586) -->
  <path d="M 550 168 L 550 178 L 408 178 L 408 586 L 377 586" stroke="#f59e0b" stroke-width="2.2" fill="none"/>
  <line x1="408" y1="320" x2="377" y2="320" stroke="#f59e0b" stroke-width="2.2"/>
  <circle cx="408" cy="320" r="4" fill="#f59e0b"/>

  <!-- PN532 SCL (377,256) -> ESP32 Pin L3 GPIO 22 (496,410) -->
  <path d="M 377 256 L 426 256 L 426 410 L 496 410" stroke="#a855f7" stroke-width="2.5" fill="none"/>

  <!-- PN532 SDA (377,288) -> ESP32 Pin L6 GPIO 21 (496,468) -->
  <path d="M 377 288 L 444 288 L 444 468 L 496 468" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- Buzzer I/O (377,548) -> ESP32 Pin R11 GPIO 27 (939,496) via bottom channel y=720 -->
  <path d="M 377 548 L 462 548 L 462 720 L 955 720 L 955 496 L 939 496" stroke="#facc15" stroke-width="2.5" fill="none"/>

  <!-- Common Ground Spine (x=390 left sensors, x=478 ESP32 left, x=946 ESP32 right) -->
  <path d="M 377 352 L 390 352 L 390 734" stroke="#22c55e" stroke-width="2.2" fill="none"/>
  <line x1="377" y1="624" x2="390" y2="624" stroke="#22c55e" stroke-width="2.2"/>
  <circle cx="390" cy="624" r="4" fill="#22c55e"/>
  <circle cx="390" cy="734" r="4.5" fill="#4ade80"/>

  <path d="M 496 356 L 478 356 L 478 734" stroke="#22c55e" stroke-width="2.2" fill="none"/>
  <line x1="496" y1="526" x2="478" y2="526" stroke="#22c55e" stroke-width="2.2"/>
  <circle cx="478" cy="526" r="4" fill="#22c55e"/>
  <circle cx="478" cy="734" r="4.5" fill="#4ade80"/>

  <path d="M 939 566 L 946 566 L 946 734" stroke="#22c55e" stroke-width="2.2" fill="none"/>
  <circle cx="946" cy="734" r="4.5" fill="#4ade80"/>

  <!-- Wired HDMI/USB Trunk: Display <-> Pi 5 -->
  <path d="M 1110 422 L 1110 514" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)"/>
  <text x="1120" y="438" font-size="9.5" font-weight="bold" fill="#7dd3fc">HDMI + USB Touch</text>

  <!-- Wireless TCP Link: ESP32 <-> Pi 5 -->
  <path d="M 940 310 L 986 310 L 986 716 L 1008 716" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- FOOTER INFO -->
  <text x="40" y="818" font-size="11.5" fill="#94a3b8">Notes: 1) Zero keypad &amp; zero 16×2 LCD pins used — replaced by 800×480 Display on Pi 5 Kiosk.  2) All Pod electronics mount inside frame_rear_housing.stl behind monitor.</text>
  <text x="40" y="838" font-size="11.5" fill="#38bdf8">       3) Raspberry Pi 5 ceiling hub enclosure &amp; overhead 4K camera assembly remain unmodified.  4) Ground bus shared across 5V &amp; 3.3V subsystems.</text>
</svg>
