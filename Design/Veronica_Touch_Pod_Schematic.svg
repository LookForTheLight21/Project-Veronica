<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 820" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0b1b33" />
    </linearGradient>
    <linearGradient id="nfcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
  </defs>

  <!-- Title Header Banner -->
  <rect x="30" y="20" width="1290" height="70" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="50" y="50" font-size="20" font-weight="bold" fill="#38bdf8" letter-spacing="1">PROJECT VERONICA — TIFDP0018 TOUCH POD HARDWARE SCHEMATIC</text>
  <text x="50" y="74" font-size="12" fill="#94a3b8">ESP32-WROOM 38-Pin  •  Robocraze TIFDP0018 3.5" TFT (ILI9486 + XPT2046)  •  PN532 I2C NFC Reader  •  Active Buzzer</text>

  <!-- Power Distribution Rails -->
  <!-- 5V Rail -->
  <rect x="30" y="105" width="460" height="26" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="45" y="122" font-size="11" font-weight="bold" fill="#fca5a5">+5.0V DC POWER RAIL (FROM USB / ESP32 5V0 PIN)</text>

  <!-- 3.3V Rail -->
  <rect x="510" y="105" width="440" height="26" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="525" y="122" font-size="11" font-weight="bold" fill="#fde68a">+3.3V REGULATED BUS (FROM ESP32 3V3 PIN)</text>

  <!-- Common Ground Bus -->
  <rect x="30" y="750" width="1290" height="42" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.8"/>
  <text x="500" y="776" font-size="13" font-weight="bold" fill="#4ade80" letter-spacing="1">COMMON SYSTEM GROUND RETURN BUS (0V GND)</text>

  <!-- ======================================================== -->
  <!-- 1. MODULE: PN532 NFC READER (TOP LEFT) -->
  <!-- ======================================================== -->
  <rect x="30" y="150" width="280" height="250" rx="12" fill="url(#nfcGrad)" stroke="#ef4444" stroke-width="2"/>
  <rect x="42" y="162" width="256" height="28" rx="6" fill="#991b1b"/>
  <text x="170" y="181" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PN532 NFC V3 (I2C MODE)</text>

  <!-- Soldered top pins -->
  <circle cx="80" cy="225" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="95" y="229" font-size="12" font-weight="bold" fill="#e9d5ff">SCL</text>
  <text x="135" y="229" font-size="10" fill="#cbd5e1">➔ GPIO 22 (Clock)</text>

  <circle cx="80" cy="265" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="95" y="269" font-size="12" font-weight="bold" fill="#bae6fd">SDA</text>
  <text x="135" y="269" font-size="10" fill="#cbd5e1">➔ GPIO 21 (Data)</text>

  <circle cx="80" cy="305" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="95" y="309" font-size="12" font-weight="bold" fill="#fef08a">VCC</text>
  <text x="135" y="309" font-size="10" fill="#cbd5e1">➔ 3.3V DC Bus</text>

  <circle cx="80" cy="345" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="95" y="349" font-size="12" font-weight="bold" fill="#86efac">GND</text>
  <text x="135" y="349" font-size="10" fill="#cbd5e1">➔ Ground Bus</text>

  <rect x="42" y="365" width="256" height="24" rx="4" fill="#18181b"/>
  <text x="170" y="381" font-size="10" font-weight="bold" fill="#facc15" text-anchor="middle">DIP SWITCH: SEL0=1 (ON), SEL1=0 (OFF)</text>

  <!-- ======================================================== -->
  <!-- 2. MODULE: ACTIVE BUZZER MODULE (BOTTOM LEFT) -->
  <!-- ======================================================== -->
  <rect x="30" y="440" width="280" height="260" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <rect x="42" y="452" width="256" height="28" rx="6" fill="#0369a1"/>
  <text x="170" y="471" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ACTIVE PIEZO BUZZER MODULE</text>

  <!-- Round Buzzer Element Graphic -->
  <circle cx="90" cy="540" r="30" fill="#090d16" stroke="#0284c7" stroke-width="2.5"/>
  <circle cx="90" cy="540" r="8" fill="#0284c7"/>
  <text x="90" y="585" font-size="10" fill="#94a3b8" text-anchor="middle">Buzzer Transducer</text>

  <!-- Pins -->
  <circle cx="170" cy="515" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="185" y="519" font-size="12" font-weight="bold" fill="#fef08a">I / O</text>
  <text x="220" y="519" font-size="10" fill="#cbd5e1">➔ GPIO 25</text>

  <circle cx="170" cy="550" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="185" y="554" font-size="12" font-weight="bold" fill="#fef08a">VCC</text>
  <text x="220" y="554" font-size="10" fill="#cbd5e1">➔ 3.3V Bus</text>

  <circle cx="170" cy="585" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="185" y="589" font-size="12" font-weight="bold" fill="#86efac">GND</text>
  <text x="220" y="589" font-size="10" fill="#cbd5e1">➔ Ground Bus</text>

  <text x="170" y="660" font-size="10" fill="#38bdf8" text-anchor="middle">Built-in driver transistor on module</text>

  <!-- ======================================================== -->
  <!-- 3. CENTRAL CONTROLLER: ESP32-WROOM (38-PIN) -->
  <!-- ======================================================== -->
  <rect x="370" y="150" width="370" height="570" rx="16" fill="url(#espGrad)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Metal RF Shield Graphic -->
  <rect x="420" y="170" width="270" height="110" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="555" y="210" font-size="14" font-weight="bold" fill="#f1f5f9" text-anchor="middle" letter-spacing="1">ESPRESSIF</text>
  <text x="555" y="232" font-size="12" fill="#94a3b8" text-anchor="middle">ESP32-WROOM-32D (38-PIN)</text>
  <text x="555" y="252" font-size="9" fill="#38bdf8" text-anchor="middle" font-family="monospace">WI-FI &amp; BLUETOOTH DUAL-CORE</text>

  <!-- Left Header Strip (38-pin: Left Rail) -->
  <rect x="375" y="295" width="30" height="410" rx="4" fill="#090d16" stroke="#1e293b"/>
  <!-- Right Header Strip (38-pin: Right Rail) -->
  <rect x="705" y="295" width="30" height="410" rx="4" fill="#090d16" stroke="#1e293b"/>

  <!-- LEFT PINS -->
  <!-- 3V3 (Pin 1) -->
  <circle cx="390" cy="315" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="412" y="320" font-size="11" font-weight="bold" fill="#fde68a">Pin 1: 3V3 (Power Out)</text>

  <!-- GPIO 25 (Pin 9) -->
  <circle cx="390" cy="455" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="412" y="460" font-size="11" font-weight="bold" fill="#fbbf24">Pin 9: GPIO 25 (Buzzer)</text>

  <!-- GND (Pin 14) -->
  <circle cx="390" cy="545" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="412" y="550" font-size="11" font-weight="bold" fill="#86efac">Pin 14: GND (Ground)</text>

  <!-- 5V0 / VIN (Pin 19) -->
  <circle cx="390" cy="680" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="412" y="685" font-size="11" font-weight="bold" fill="#fca5a5">Pin 19: 5V0 / VIN (USB 5V)</text>

  <!-- RIGHT PINS -->
  <!-- Pin 1: GND -->
  <circle cx="720" cy="315" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="320" font-size="11" font-weight="bold" fill="#86efac" text-anchor="end">Pin 1: GND</text>

  <!-- Pin 2: GPIO 23 (MOSI) -->
  <circle cx="720" cy="350" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="355" font-size="11" font-weight="bold" fill="#d8b4fe" text-anchor="end">Pin 2: GPIO 23 (MOSI)</text>

  <!-- Pin 3: GPIO 22 (SCL) -->
  <circle cx="720" cy="390" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="395" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="end">Pin 3: GPIO 22 (I2C SCL)</text>

  <!-- Pin 6: GPIO 21 (SDA) -->
  <circle cx="720" cy="435" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="440" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="end">Pin 6: GPIO 21 (I2C SDA)</text>

  <!-- Pin 8: GPIO 19 (MISO) -->
  <circle cx="720" cy="485" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="490" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="end">Pin 8: GPIO 19 (MISO)</text>

  <!-- Pin 9: GPIO 18 (SCK) -->
  <circle cx="720" cy="530" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="535" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="end">Pin 9: GPIO 18 (SPI SCK)</text>

  <!-- Pin 10: GPIO 5 (TOUCH_CS) -->
  <circle cx="720" cy="575" r="7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="580" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="end">Pin 10: GPIO 5 (TP_CS)</text>

  <!-- Pin 15: GPIO 2 (DC) -->
  <circle cx="720" cy="625" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="630" font-size="11" font-weight="bold" fill="#fdba74" text-anchor="end">Pin 15: GPIO 2 (LCD_DC)</text>

  <!-- Pin 16: GPIO 15 (LCD_CS) -->
  <circle cx="720" cy="665" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="700" y="670" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="end">Pin 16: GPIO 15 (LCD_CS)</text>

  <!-- ======================================================== -->
  <!-- 4. MODULE: ROBOCRAZE TIFDP0018 3.5" DISPLAY -->
  <!-- ======================================================== -->
  <rect x="850" y="150" width="470" height="570" rx="16" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="865" y="165" width="440" height="32" rx="6" fill="#1e3a8a"/>
  <text x="1085" y="187" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ROBOCRAZE TIFDP0018 (3.5" TFT SPI 480×320)</text>

  <!-- 26-Pin Socket Box Graphic -->
  <rect x="870" y="220" width="130" height="475" rx="8" fill="#090d16" stroke="#64748b" stroke-width="1.5"/>
  <text x="935" y="240" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">26-PIN SOCKET</text>

  <!-- Pins on the Display Socket -->
  <!-- Pin 2: 5V -->
  <circle cx="975" cy="275" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="960" y="280" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="end">Pin 2 (5V)</text>
  <text x="1015" y="280" font-size="11" fill="#fca5a5">Backlight &amp; Logic Power (5V)</text>

  <!-- Pin 6: GND -->
  <circle cx="975" cy="325" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
  <text x="960" y="330" font-size="10" font-weight="bold" fill="#86efac" text-anchor="end">Pin 6 (GND)</text>
  <text x="1015" y="330" font-size="11" fill="#86efac">Display Ground</text>

  <!-- Pin 18: LCD_RS (DC) -->
  <circle cx="975" cy="390" r="7" fill="#fb923c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="960" y="395" font-size="10" font-weight="bold" fill="#fdba74" text-anchor="end">Pin 18 (DC)</text>
  <text x="1015" y="395" font-size="11" fill="#fdba74">LCD Command / Data (RS)</text>

  <!-- Pin 19: LCD_SI (MOSI) -->
  <circle cx="915" cy="445" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="935" y="450" font-size="10" font-weight="bold" fill="#d8b4fe">Pin 19 (MOSI)</text>
  <text x="1015" y="450" font-size="11" fill="#d8b4fe">SPI Data (Shared by LCD &amp; Touch)</text>

  <!-- Pin 21: TP_SO (MISO) -->
  <circle cx="915" cy="505" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <text x="935" y="510" font-size="10" font-weight="bold" fill="#bae6fd">Pin 21 (MISO)</text>
  <text x="1015" y="510" font-size="11" fill="#bae6fd">Touch Feedback (XPT2046)</text>

  <!-- Pin 23: LCD_SCK -->
  <circle cx="915" cy="565" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="935" y="570" font-size="10" font-weight="bold" fill="#fde68a">Pin 23 (SCK)</text>
  <text x="1015" y="570" font-size="11" fill="#fde68a">SPI Clock Line (Shared)</text>

  <!-- Pin 24: LCD_CS -->
  <circle cx="975" cy="620" r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="960" y="625" font-size="10" font-weight="bold" fill="#93c5fd" text-anchor="end">Pin 24 (CE0)</text>
  <text x="1015" y="625" font-size="11" fill="#93c5fd">LCD Display Chip Select</text>

  <!-- Pin 26: TP_CS -->
  <circle cx="975" cy="670" r="7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <text x="960" y="675" font-size="10" font-weight="bold" fill="#6ee7b7" text-anchor="end">Pin 26 (CE1)</text>
  <text x="1015" y="675" font-size="11" fill="#6ee7b7">Touch Panel Chip Select (TCS)</text>

  <!-- Note on Pin 22 Auto-Reset -->
  <rect x="1015" y="222" width="280" height="34" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="1025" y="236" font-size="9.5" fill="#facc15" font-weight="bold">⚡ Reset note: Internal auto-reset on board.</text>
  <text x="1025" y="248" font-size="9" fill="#94a3b8">Pin 22 is NC / auto-reset (TFT_RST = -1)</text>


  <!-- ======================================================== -->
  <!-- INTER-MODULE WIRES & BUS TRACES -->
  <!-- ======================================================== -->

  <!-- 1. Power Traces -->
  <!-- ESP32 Pin 19 (5V0) to 5V Rail -->
  <path d="M 390 680 L 250 680 L 250 131" stroke="#ef4444" stroke-width="2.5" fill="none"/>
  <!-- 5V Rail to Display Pin 2 -->
  <path d="M 280 105 L 280 90 L 1050 90 L 1050 275 L 982 275" stroke="#ef4444" stroke-width="2.5" fill="none"/>

  <!-- ESP32 Pin 1 (3V3) to 3.3V Rail -->
  <path d="M 390 315 L 340 315 L 340 120 L 510 120" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <!-- 3.3V Rail to PN532 VCC -->
  <path d="M 540 131 L 540 140 L 230 140 L 230 305 L 87 305" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <!-- 3.3V Rail to Buzzer VCC -->
  <path d="M 520 131 L 520 145 L 240 145 L 240 550 L 177 550" stroke="#f59e0b" stroke-width="2" fill="none"/>

  <!-- 2. Ground Traces to Common Bus -->
  <!-- ESP32 Pin 14 (GND) to Bus -->
  <line x1="390" y1="545" x2="330" y2="545" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="330" y1="545" x2="330" y2="750" stroke="#22c55e" stroke-width="2.5"/>

  <!-- ESP32 Right Pin 1 (GND) to Bus -->
  <path d="M 727 315 L 800 315 L 800 750" stroke="#22c55e" stroke-width="2" fill="none"/>

  <!-- PN532 GND to Bus -->
  <path d="M 87 345 L 20 345 L 20 750" stroke="#22c55e" stroke-width="2" fill="none"/>

  <!-- Buzzer GND to Bus -->
  <path d="M 177 585 L 140 585 L 140 750" stroke="#22c55e" stroke-width="2" fill="none"/>

  <!-- Display GND (Pin 6) to Bus -->
  <path d="M 982 325 L 1020 325 L 1020 750" stroke="#22c55e" stroke-width="2.5" fill="none"/>

  <!-- 3. Signal Lines -->
  <!-- Buzzer I/O to ESP32 Pin 9 (GPIO 25) -->
  <path d="M 177 515 L 340 515 L 340 455 L 383 455" stroke="#fbbf24" stroke-width="2.5" fill="none"/>

  <!-- PN532 SCL to ESP32 Pin 3 (GPIO 22) -->
  <path d="M 87 225 L 350 225 L 350 390 L 713 390" stroke="#c084fc" stroke-width="2.5" fill="none"/>

  <!-- PN532 SDA to ESP32 Pin 6 (GPIO 21) -->
  <path d="M 87 265 L 360 265 L 360 435 L 713 435" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- ESP32 Pin 2 (GPIO 23 MOSI) to Display Pin 19 -->
  <path d="M 727 350 L 760 350 L 760 445 L 908 445" stroke="#d8b4fe" stroke-width="2.5" fill="none"/>

  <!-- ESP32 Pin 8 (GPIO 19 MISO) to Display Pin 21 -->
  <path d="M 727 485 L 770 485 L 770 505 L 908 505" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- ESP32 Pin 9 (GPIO 18 SCK) to Display Pin 23 -->
  <path d="M 727 530 L 780 530 L 780 565 L 908 565" stroke="#f59e0b" stroke-width="2.5" fill="none"/>

  <!-- ESP32 Pin 10 (GPIO 5 TP_CS) to Display Pin 26 -->
  <path d="M 727 575 L 790 575 L 790 670 L 968 670" stroke="#10b981" stroke-width="2.5" fill="none"/>

  <!-- ESP32 Pin 15 (GPIO 2 DC) to Display Pin 18 -->
  <path d="M 727 625 L 820 625 L 820 390 L 968 390" stroke="#fb923c" stroke-width="2.5" fill="none"/>

  <!-- ESP32 Pin 16 (GPIO 15 LCD_CS) to Display Pin 24 -->
  <path d="M 727 665 L 830 665 L 830 620 L 968 620" stroke="#3b82f6" stroke-width="2.5" fill="none"/>

</svg>
